# Serves the built SPA and proxies /api to the backend container.
#
# Migration runs are long: backend/src/server.js sets server.timeout to 30 min,
# and the Vite dev proxy disables timeouts entirely. The read timeout below is
# the production equivalent — without it nginx would return 504 mid-migration.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    1900s;
        proxy_read_timeout    1900s;
        proxy_buffering       off;
    }

    # Hashed Vite assets are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # BrowserRouter — every unknown path must fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
