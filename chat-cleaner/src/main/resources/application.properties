# Optional: project-root application-local.properties (gitignored) for microsoft.client-secret.
spring.config.import=optional:file:./application-local.properties

google.service-account.key-path=service-account.json
google.admin.email=mia@cloudfuze.com

# Microsoft Graph (Teams) — one app registration; token = https://graph.microsoft.com/.default
# Application permissions + Grant admin consent (see TeamsGraphApplicationPermissions.java):
#   Fetch/preview: User.Read.All, Group.Read.All, Chat.Read.All
#   Delete teams/messages: also Group.ReadWrite.All, Chat.ReadWrite.All
# Secret = Certificates & secrets → Value for app bde73b8d-… (not Secret ID).
# Set secret only in application-local.properties (gitignored) OR env MICROSOFT_CLIENT_SECRET.
# Do not add microsoft.client-secret here — it would override the imported file with a blank value.
microsoft.tenant-id=${MICROSOFT_TENANT_ID:807d6772-847c-40e2-9bec-e2c930b3a42e}
# Must match the App registration that has Graph permissions + secret (e.g. filefuze).
microsoft.client-id=${MICROSOFT_CLIENT_ID:bde73b8d-64a1-443f-b2dc-0647ff05044e}
# Teams DMs/chats: when set, only this user is scanned for /users/{id}/chats (e.g. erik@filefuze.co). Leave empty to scan whole tenant.
microsoft.admin.email=${MICROSOFT_ADMIN_EMAIL:erik@filefuze.co}
microsoft.teams.chat-user-scan-limit=2000
# After listing chats, call newest message per chat for accurate date-range (needs Chat.Read.All).
microsoft.teams.enrich-chat-last-message=true

# Slack — Business+ plan
# Create app at https://api.slack.com/apps → add these USER-token scopes:
#   channels:read  channels:history  groups:read  groups:history
#   im:read        im:history        mpim:read    mpim:history
#   users:read     channels:write    groups:write im:write
#   mpim:write     chat:write
# Install to Workspace as a Workspace Owner/Admin and copy the User OAuth Token (xoxp-...).
# Put the real token in application-local.properties (gitignored) — NOT here.
slack.user-token=${SLACK_USER_TOKEN:}
slack.bot-token=${SLACK_BOT_TOKEN:}
slack.team-id=${SLACK_TEAM_ID:}
# Scope deletion to a single user's DMs later if needed (leave blank on Business+).
slack.admin.user=
# false = Business+: conversations.archive channels, conversations.close DMs (safe default).
# true  = Enterprise Grid: use admin.conversations.delete + slack.enterprise-admin-token.
slack.enterprise-grid=false
slack.enterprise-admin-token=${SLACK_ENTERPRISE_ADMIN_TOKEN:}
# When true, iterate conversations.history + chat.delete each message BEFORE archiving (slow, rate-limited).
slack.delete-messages=false
slack.channel-scan-limit=2000
slack.enrich-last-message=true

server.port=8080
spring.mvc.async.request-timeout=1200000
spring.jackson.serialization.write-dates-as-timestamps=false

logging.level.com.cloudfuze=INFO
logging.pattern.console=%d{HH:mm:ss} [%level] %msg%n
